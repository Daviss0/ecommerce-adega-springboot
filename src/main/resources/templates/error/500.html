
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Erro interno - Adega do Campinho</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: #eef6fa;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .error-card {
            background: #fff;
            border-radius: 20px;
            padding: 45px;
            max-width: 550px;
            width: 90%;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .error-icon {
            font-size: 64px;
            color: #1e6fa8;
            margin-bottom: 20px;
        }

        .error-code {
            font-size: 72px;
            font-weight: bold;
            color: #1e6fa8;
        }

        .error-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .error-message {
            color: #6c757d;
            margin-bottom: 30px;
        }

        .btn-home {
            display: inline-block;
            background: #1e6fa8;
            color: #fff;
            border-radius: 10px;
            padding: 10px 22px;
            text-decoration: none;
        }

        .btn-home:hover {
            background: #175b8b;
            color: #fff;
        }
    </style>
</head>

<body>

<div class="error-card">

    <i class="bi bi-exclamation-triangle error-icon"></i>

    <div class="error-code">500</div>

    <h1 class="error-title">
        Erro interno do servidor
    </h1>

    <p class="error-message">
        Ocorreu um problema inesperado.
        Tente novamente em alguns instantes.
    </p>

    <a href="/store/homepage" class="btn-home">
        <i class="bi bi-house-door me-1"></i>
        Voltar para a loja
    </a>

</div>

</body>
</html>
