<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Produtos - Adega do Campinho</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>

    body {
      min-height: 100vh;
      background: #eef6fa;
      font-family: Arial, Sans-serif;
    }

    .sidebar {
      width: 230px;
      min-height: 100vh;
      background: #1e6fa8;
      color: #fff;
      position: fixed;
      left: 0;
      top: 0;
      padding: 25px 18px;
    }

    .sidebar h4 {
      font-weight: bold;
      margin-bottom: 40px;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #eaf6ff;
      text-decoration: none;
      padding: 12px 10px;
      border-radius: 10px;
      margin-bottom: 8px;
      transition: 0.2s;
    }

    .menu-item:hover,
    .menu-item.active {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .logout-btn {
      background: none;
      border: none;
      color: #eaf6ff;
      width: 100%;
      text-align: left;
      padding: 12px 10px;
    }

    .logout-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .main-content {
      margin-left: 230px;
      padding: 30px;
    }

    .topbar {
      background: #fff;
      border-radius: 18px;
      padding: 18px 25px;
      box-shadow: 0px 8px 25px rgba(0, 0, 0, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .search-box {
      width: 280px;
      background: #dff7ff;
      border: none;
      border-radius: 12px;
      padding: 10px 15px;
      outline: none;
    }

    .products-card {
      background: #fff;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
    }

    .products-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .btn-new {
      border: none;
      border-radius: 12px;
      padding: 10px 18px;
      background: linear-gradient(90deg, #35c4d9, #5a83e6);
      color: #fff;
      font-weight: 600;
      text-decoration: none;
    }

    .btn-new:hover {
      opacity: 0.9;
      color: #fff;
    }

    .table {
      margin-bottom: 0;
    }

    .table thead th {
      background: #f5fbff;
      color: #1e6fa8;
      font-size: 14px;
      border-bottom: 1px solid #e3edf5;
      padding: 14px;
    }

    .table tbody td {
      vertical-align: middle;
      padding: 14px;
      color: #333;
      font-size: 14px;
    }

    .product-img {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      object-fit: cover;
      background: #dff7ff;
    }


    .status-active {
      background: #d1f7e0;
      color: #168a45;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }

    .status-inactive {
      background: #ffd6d6;
      color: #b42323;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }

    .action-btn {
      border: none;
      border-radius: 10px;
      padding: 7px 10px;
      color: #fff;
      text-decoration: none;
      margin-right: 5px;
    }

    .btn-view {
      background: #35c4d9;
    }

    .btn-edit {
      background: #5a83e6;
    }

    .btn-delete {
      background: #dc3545;
    }

    .action-btn:hover {
      opacity: 0.85;
      color: #fff;
    }
  </style>
</head>
<body>

<aside class="sidebar">
  <h4>Adega Admin</h4>

  <a th:href="@{/admin/home_adm}" class="menu-item">
    <i class="bi bi-grid-fill"></i>
    Dashboard
  </a>

  <a th:href="@{/admin/products}" class="menu-item active">
    <i class="bi bi-box-seam"></i>
    Produtos
  </a>

  <a th:href="@{/admin/clients}" class="menu-item">
    <i class="bi bi-people-fill"></i>
    Clientes
  </a>

  <a href="#" class="menu-item">
    <i class="bi bi-cart-check-fill"></i>
    Pedidos
  </a>

  <a href="#" class="menu-item">
    <i class="bi bi-clipboard-data-fill"></i>
    Estoque
  </a>

  <a th:href="@{/admin/users}" class="menu-item">
    <i class="bi bi-person-gear"></i>
    Usuários
  </a>

  <form th:action="@{/logout}" method="post" class="mt-5">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <button type="submit" class="logout-btn">
      <i class="bi bi-box-arrow-right"></i>
      Sair
    </button>
  </form>
</aside>

<main class="main-content">

  <div class="topbar">
    <div>
      <h3 class="mb-0">Produtos</h3>
      <small class="text-muted">Gerencie os produtos cadastrados no sistema</small>
    </div>

    <form th:action="@{/admin/products}" method="get">
      <input type="text"
      name="keyword"
      class="search-box"
      placeholder="Pesquisar produto..."
      th:value="${keyword}">
    </form>
  </div>

  <div class="products-card">

    <div class="products-header">
      <h5 class="mb-0">Lista de Produtos</h5>

      <a th:href="@{/admin/products/new}" class="btn btn-primary">
        <i class="bi bi-plus-circle"></i>
        Novo Produto
      </a>
    </div>

    <div class="table-responsive">
      <table class="table align-middle">
        <thead>
        <tr>
          <th>Imagem</th>
          <th>Nome</th>
          <th>Categoria</th>
          <th>Preço</th>
          <th>Estoque</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>
        </thead>

        <tbody>

        <tr th:if="${#lists.isEmpty(products)}">
          <td colspan="7" class="text-center text-muted py-4">
            Nenhum produto cadastrado.
          </td>
        </tr>

        <tr th:each="product : ${products}">
          <td>
            <img th:if="${product.imageData != null}"
                 th:src="@{/admin/products/image/{id}(id=${product.id})}"
                 class="product-img"
                 alt="Imagem do produto">

            <div th:if="${product.imageData == null}" class="product-img">
              <i class="bi bi-image"></i>
            </div>
          </td>

          <td th:text="${product.name}"></td>

          <td th:text="${product.category}"></td>

          <td th:text="${#numbers.formatCurrency(product.price)}"></td>

          <td th:text="${product.stock}"></td>

          <td>
            <span th:if="${product.status}" class="status-active">Ativo</span>
            <span th:unless="${product.status}" class="status-inactive">Inativo</span>
          </td>

          <td>
            <a href="#"
               class="action-btn btn-view"
               data-bs-toggle="modal"
               th:data-bs-target="'#viewProductModal' + ${product.id}">
              <i class="bi bi-eye"></i>
            </a>

            <a th:href="@{/admin/products/edit/{id}(id=${product.id})}"
               class="action-btn btn-edit">
              <i class="bi bi-pencil"></i>
            </a>

            <form th:action="@{/admin/products/delete/{id}(id=${product.id})}"
               method="post"
               style="display: inline; ,margin:0; padding:0">

              <input type="hidden"
              th:name="${_csrf.parameterName}"
              th:value="${_csrf.token}">

              <button type="submit"
              class="action-btn btn-delete"
              onclick="return confirm('Deseja realmente excluir este produto?')">

              <i class="bi bi-trash"></i>
              </button>
            </form>

          </td>
        </tr>
        </tbody>
      </table>

      <th:block th:each="product : ${products}">
        <div class="modal fade"
             th:id="'viewProductModal' + ${product.id}"
             tabindex="-1">

          <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4">


              <div class="modal-header">
                <h5 class="modal-title"
                th:text="${product.name}">
                </h5>

                <button type="button"
                class="btn-close"
                data-bs-dismiss="modal">
                </button>
              </div>

              <div class="modal-body text-center">

                <img th:if="${product.imageData != null}"
                     th:src="@{/admin/products/image/{id}(id=${product.id})}"
                class="img-fluid rounded-4 mb-3"
                style="max-height: 300px; object-fit: contain;">

                <div class="text-start">

                  <p>
                    <strong>Categoria</strong>
                    <span th:text="${product.category}"></span>
                  </p>

                  <p>
                     <strong>Preço:</strong>
                    <span th:text="${#numbers.formatCurrency(product.price)}"></span>
                  </p>

                  <p>
                    <strong>Estoque:</strong>
                    <span th:text="${product.stock}"></span>
                  </p>
                </div>

              </div>
            </div>
          </div>
        </div>
      </th:block>

    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
