<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Produto</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>

    body {
      min-height: 100vh;
      background: #eef6fa;
      font-family: Arial, sans-serif;
    }

    .sidebar {
      width: 230px;
      min-height: 100vh;
      background: #1e6fa8;
      color: #fff;
      position: fixed;
      left: 0;
      top: 0;
      padding: 25px 18px;
    }

    .sidebar h4 {
      font-weight: bold;
      margin-bottom: 40px;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #eaf6ff;
      text-decoration: none;
      padding: 12px 10px;
      border-radius: 10px;
      margin-bottom: 8px;
      transition: 0.2s;
    }

    .menu-item:hover,
    .menu-item:active {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .logout-btn {
      background: none;
      border: none;
      color: #eaf6ff;
      width: 100%;
      text-align: left;
      padding: 12px 10px;
    }

    .logout-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .main-content {
      margin-left: 230px;
      padding: 30px;
    }

    .topbar {
      background: #fff;
      border-radius: 18px;
      padding: 18px 25px;
      box-shadow: 0px 8px 25px rgba(0, 0, 0, 0.08);
      margin-bottom: 30px;
    }

    .form-card {
      background: #fff;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
    }

    .form-label {
      font-weight: 600;
      color: #1e6fa8;
    }

    .form-control,
    .form-select {
      border-radius: 12px;
      padding: 10px 14px;
    }

    .current-img {
      width: 140px;
      height: 140px;
      border-radius: 18px;
      object-fit: cover;
      background: #dff7ff;
      border: 1px solid #e3edf5;
    }

    .btn-save {
      border: none;
      border-radius: 12px;
      padding: 10px 18px;
      background: linear-gradient(90deg, #35c4d9, #5a83e6);
      color: #fff;
      font-weight: 600;
    }

    .btn-save:hover {
      opacity: 0.9;
      color: #fff;
    }

    .btn-back {
      border-radius: 12px;
      padding: 10px 18px;
      font-weight: 600;
    }
  </style>
</head>

<body>

<aside class="sidebar">
  <h4>Adega Admin</h4>

  <a th:href="@{/admin/home_adm}" class="menu-item">
    <i class="bi bi-grid-fill"></i>
    Dashboard
  </a>

  <a th:href="@{/admin/products}" class="menu-item active">
    <i class="bi bi-box-seam"></i>
    Produtos
  </a>

  <a th:href="@{/admin/clients}" class="menu-item">
    <i class="bi bi-people-fill"></i>
    Clientes
  </a>

  <a href="#" class="menu-item">
    <i class="bi bi-cart-check-fill"></i>
    Pedidos
  </a>

  <a href="#" class="menu-item">
    <i class="bi bi-clipboard-data-fill"></i>
    Estoque
  </a>

  <form th:action="@{/logout}" method="post" class="mt-5">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <button type="submit" class="logout-btn">
      <i class="bi bi-box-arrow-right"></i>
      Sair
    </button>
  </form>
</aside>

<main class="main-content">
  <div class="topbar">
    <h3 class="mb-0">Editar Produto</h3>
    <small class="text-muted">Altere os dados do produto cadastrado</small>
  </div>

  <div class="form-card">

    <form th:action="@{/admin/products/update/{id}(id=${product.id})}"
    th:object="${product}"
    method="post"
    enctype="multipart/form-data">

      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

      <div class="mb-4">
        <label class="form-label">Imagem atual</label><br>

        <img th:if="${product.imageData != null}"
             th:src="@{/admin/products/image/{id}(id=${product.id})}"
             class="current-img"
             alt="Imagem atual do produto">

        <div th:if="${product.imageData == null}" class="current-img d-flex align-items-center justify-content-center">
          <i class="bi bi-image fs-1 text-muted"></i>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Alterar imagem</label>
        <input type="file" name="imageFile" class="form-control" accept="image/*">
      </div>

      <div class="mb-3">
        <label class="form-label">Nome</label>
        <input type="text" th:field="*{name}" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Categoria</label>
        <input type="text" th:field="*{category}" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Preço</label>
        <input type="number" th:field="*{price}" class="form-control" step="0.01" min="0" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Estoque</label>
        <input type="number" th:field="*{stock}" class="form-control" min="0" required>
      </div>

      <div class="mb-4">
        <label class="form-label">Status</label>
        <select th:field="*{status}" class="form-select">
          <option th:value="true">Ativo</option>
          <option th:value="false">Inativo</option>
        </select>
      </div>

      <button type="submit" class="btn-save">
        <i class="bi bi-check-circle"></i>
        Salvar Alterações
      </button>

      <a th:href="@{/admin/products}" class="btn btn-secondary btn-back ms-2">
        <i class="bi bi-arrow-left"></i>
        Voltar
      </a>
    </form>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
