<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Login - Adega do Campinho</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      min-height: 100vh;
      background: #eef6fa;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: absolute;
      width: 520px;
      height: 520px;
      background: linear-gradient(135deg, #37c6d9, #5f8fe8);
      border-radius: 50%;
      right: -120px;
      top: 70px;
      opacity: 0.75;
    }

    body::after {
      content: "";
      position: absolute;
      width: 430px;
      height: 430px;
      background: linear-gradient(135deg, #37c6d9, #5f8fe8);
      border-radius: 50%;
      left: -170px;
      bottom: -120px;
      opacity: 0.65;
    }

    .small-circle {
      position: absolute;
      width: 24px;
      height: 24px;
      background: linear-gradient(135deg, #37c6d9, #5f8fe8);
      border-radius: 50%;
      top: 120px;
      left: 130px;
      opacity: 0.8;
    }

    .login-container {
      position: relative;
      z-index: 1;
      width: 760px;
      min-height: 380px;
      background: #fff;
      display: flex;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.15);
    }

    .login-left {
      width: 50%;
      background: linear-gradient(180deg, #35c4d9, #5a83e6);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-icon {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: #fff;
      color: #4b96df;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 58px;
    }

    .login-right {
      width: 50%;
      padding: 45px 55px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .login-title {
      font-size: 20px;
      font-weight: 600;
      color: #333;
      text-align: center;
      margin-bottom: 35px;
    }

    .form-control {
      border: none;
      border-bottom: 1px solid #777;
      border-radius: 0;
      padding-left: 0;
      font-size: 14px;
    }

    .form-control:focus {
      box-shadow: none;
      border-color: #3cbfd9;
    }

    .btn-login {
      border: none;
      border-radius: 25px;
      padding: 10px;
      background: linear-gradient(90deg, #35c4d9, #5a83e6);
      color: #fff;
      font-weight: 500;
      margin-top: 20px;
    }

    .btn-login:hover {
      opacity: 0.9;
      color: #fff;
    }

    .forgot-link {
      font-size: 12px;
      color: #4b96df;
      text-decoration: none;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="small-circle"></div>

<div class="login-container">

  <div class="login-left">
    <div class="login-icon">
      <i class="bi bi-person-fill"></i>
    </div>
  </div>

  <div class="login-right">
    <h2 class="login-title">Login Administrativo</h2>

    <div th:if="${param.error}" class="alert alert-danger text-center py-2">
      E-mail ou senha inválidos.
    </div>

    <div th:if="${param.logout}" class="alert alert-success text-center py-2">
      Logout realizado com sucesso.
    </div>

    <form th:action="@{/login}" method="post" autocomplete="off">

      <input type="hidden"
             th:name="${_csrf.parameterName}"
             th:value="${_csrf.token}">

      <div class="mb-4">
        <input type="email"
               class="form-control"
               id="email"
               name="email"
               placeholder="E-mail"
               autocomplete="off"
               required>
      </div>

      <div class="mb-4">
        <input type="password"
               class="form-control"
               id="password"
               name="password"
               placeholder="Senha"
               autocomplete="new-password"
               required>
      </div>

      <button type="submit" class="btn btn-login w-100">
        Entrar
      </button>
    </form>

  </div>

</div>

</body>
</html>
