<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meus Pedidos - Adega do Campinho</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/client/navbar.css}">

    <link rel="stylesheet" th:href="@{/css/client/orders.css}">

</head>
<body>

<div th:replace="~{fragments/client-navbar :: navbar(false)}"></div>

<main class="order-container">
    <div class="page-header">

        <div>
            <h2>Meus Pedidos</h2>
            <p>Acompanhe seus pedidos e consulte compras anteriores.</p>
        </div>
    </div>

    <div th:if="${orderError}" class="order-error">
        <i class="bi bi-exclamation-circle-fill"></i>

        <span th:text="${orderError}">
            Pedido não encontrado.
        </span>
    </div>

    <div class="empty-orders"
         th:if="${#lists.isEmpty(orders)}">

        <i class="bi bi-bag-x empty-orders-icon"></i>

        <h4>Você ainda não possui pedidos</h4>

        <p>
            Quando você realizar uma compra,
            seus pedidos aparecerão aqui.
        </p>

        <a th:href="@{/store/homepage}"
           class="btn-store">

            <i class="bi bi-bag"></i>
            Ver produtos

        </a>
    </div>

    <div th:unless="${#lists.isEmpty(orders)}">
        <div class="order-card" th:each="order : ${orders}">
            <div class="order-header">

                <div>

                    <div class="order-number" th:text="'Pedido #' + ${order.id}">
                        Pedido #1
                    </div>

                    <div class="order-date">
                        <i class="bi bi-calendar3"></i>

                        <span th:text="${#temporals.format(order.orderDate, 'dd/MM/yyyy HH:mm')}">
                            11/08/2026 20:00
                        </span>
                    </div>
                </div>

                <span class="status-badge" th:classappend="'status-' + ${order.status}" th:text="${order.status.description}">
                    Aguardando pagamento
                </span>
            </div>

            <div class="order-info">

                <div>
                    <span class="info-label">
                        Itens
                    </span>

                    <span class="info-value"
                          th:text="${order.totalItems}">
                        2
                    </span>
                </div>

                <div>
                    <span class="info-label">
                        Total
                    </span>

                    <span class="order-total"
                          th:text="${#numbers.formatCurrency(order.totalAmount)}">
                        R$ 100,00
                    </span>
                </div>

                <div class="text-md-end">
                    <a th:href="@{/client/orders/{id}(id=${order.id})}"
                       class="btn-details">

                        <i class="bi bi-eye"></i>
                        Ver detalhes

                    </a>
                </div>

            </div>

        </div>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


</body>
</html>
