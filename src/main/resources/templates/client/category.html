<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${categoryName + ' | Adega do Campinho'}">
        Categoria | Adega do Campinho
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/client/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/client/homepage.css}">
    <link rel="stylesheet" th:href="@{/css/client/category.css}">
</head>
<body>

<div th:replace="~{fragments/client-navbar :: navbar(true)}"></div>

<main class="category-page">
    <div class="container">

        <nav class="category-breadcrumb" aria-label="Navegação">

            <a th:href="@{/store/homepage}">
                <i class="bi bi-house-door"></i>
                Início
            </a>

            <span class="mx-2 text-muted">/</span>

            <span th:text="${categoryName}">
                Categoria
            </span>
        </nav>

        <div class="category-header">

            <h1 class="category-title" th:text="${categoryName}">
                Categoria
            </h1>

            <p class="category-description">
                Confira os produtos disponíveis nesta categoria.
            </p>
        </div>

        <div class="category-empty" th:if="${#lists.isEmpty(products)}">

            <i class="bi bi-box-seam"></i>

            <h3>Nenhum produto disponível</h3>

            <p class="text-muted">
                Ainda não temos produtos disponíveis nesta categoria.
            </p>

            <a th:href="@{/store/homepage}" class="btn btn-primary mt-2">
                Voltar para a loja
            </a>
        </div>

        <div class="row g-3" th:unless="${#lists.isEmpty(products)}">

            <div class="col-6 col-md-4 col-lg-2" th:each="product : ${products}">

                <div class="product-card h-100">

                    <div class="product-img">

                        <img th:if="${product.imageData != null}" th:src="@{/store/products/image/{id}(id=${product.id})}"
                             th:alt="${product.name}">

                        <img th:unless="${product.imageData != null}" th:src="@{/images/no-image.png}" th:alt="${product.name}">
                    </div>

                    <div class="product-name" th:text="${product.name}">
                        Nome do produto
                    </div>

                    <div class="product-category" th:text="${product.category}">
                        Categoria
                    </div>

                    <div class="price" th:text="${'R$ ' + #numbers.formatDecimal(product.price, 1, 'POINT', 2, 'COMMA')}">
                        R$ 0,00
                    </div>

                    <div class="quantity-control" sec:authorize="hasRole('CLIENT')">

                        <form th:action="@{/client/cart/products/{id}/decrease(id=${product.id})}" method="post">

                            <input type="hidden" name="categorySlug" th:value="${categorySlug}">

                            <button type="submit" class="quantity-btn" th:disabled="${quantitiesByProductId.get(product.id) == null
                                                                                    or quantitiesByProductId.get(product.id) == 0}"
                                                                                    th:attr="aria-label=${'Diminuir a quantidade de ' + product.name}">

                                <i class="bi bi-dash"></i>
                            </button>
                        </form>

                        <span class="quantity-value" th:text="${quantitiesByProductId.get(product.id) != null
                                                              ? quantitiesByProductId.get(product.id) : 0}">
                        </span>

                        <form th:action="@{/client/cart/products/{id}/increase(id=${product.id})}" method="post">

                            <input type="hidden" name="categorySlug" th:value="${categorySlug}">

                            <button type="submit" class="quantity-btn" th:attr="aria-label=${'Aumentar quantidade de ' + product.name}">
                                <i class="bi bi-plus"></i>
                            </button>
                        </form>
                    </div>

                    <a th:href="@{/client/login}" class="category-login-link" sec:authorize="isAnonymous()">
                        <i class="bi bi-cart3"></i>
                        Adicionar
                    </a>
                </div>
            </div>
        </div>
    </div>
</main>

<div class="toast-container position-fixed bottom-0 end-0 p-3 cart-toast-container">

    <div th:if="${successMessage}" class="toast cart-toast border-0" role="status" aria-live="polite" data-bs-delay="2500">

        <div class="toast-body d-flex align-items-center gap-2">
            <i class="bi bi-check-circle-fill text-success"></i>

            <span th:text="${successMessage}">
                Operação realizada com sucesso.
            </span>

            <button type="button" class="btn-close ms-auto" data-bs-dismiss="toast" aria-label="Fechar">
            </button>
        </div>
    </div>

    <div th:if="${errorMessage}" class="toast cart-toast border-0" role="alert" aria-live="assertive" data-bs-delay="3500">

        <div class="toast-body d-flex align-items-center gap-2">
            <i class="bi bi-exclamation-circle-fill text-danger"></i>

            <span th:text="${errorMessage}">
                Não foi possível realizar a operação.
            </span>

            <button type="button" class="btn-close ms-auto" data-bs-dismiss="toast" aria-label="Fechar">
            </button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


<script>
    document.addEventListener("DOMContentLoaded", function () {

        document.querySelectorAll(".toast").forEach(function (element) {
            bootstrap.Toast.getOrCreateInstance(element).show();
        });

    });
</script>

</body>
</html>
