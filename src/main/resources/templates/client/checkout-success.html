<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Pedido confirmado - Adega do Campinho</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" th:href="@{/css/client/navbar.css}">

    <link rel="stylesheet" th:href="@{/css/client/checkout-success.css}">
</head>
<body>

<div th:replace="~{fragments/client-navbar :: navbar(false)}"></div>

 <main class="success-page">

     <div class="container">

         <section class="success-card">

             <div class="success-icon">
                 <i class="bi bi-check-lg"></i>
             </div>

             <div class="success-header">

                     <span class="success-eyebrow">
                         Pedido confirmado
                     </span>

                     <h1>Pedido recebido com sucesso!</h1>
                     <p>Seu pedido foi recebido e já está registrado em nosso sistema.</p>
                 </div>

                 <div class="order-info">

                     <div class="order-info-item">

                         <span class="info-label">
                             Número do pedido
                         </span>

                         <strong class="order-number">
                             #
                             <span th:text="${order.id}">
                                 000
                             </span>
                         </strong>
                     </div>

                     <div class="order-info-divider"></div>

                     <div class="order-info-item">

                         <span class="info-label">
                             Total do pedido
                         </span>

                         <strong class="order-total" th:text="${#numbers.formatCurrency(order.totalAmount)}">
                             R$ 0,00
                         </strong>
                     </div>
                 </div>

                 <div class="success-message">
                     <i class="bi bi-info-circle"></i>

                     <p>Você pode acompanhar os detalhes e o andamento do pedido pela área "Meus Pedidos".</p>
                 </div>

                 <div class="success-actions">

                     <a th:href="@{/client/orders/{id}(id=${order.id})}" class="btn-view-order">
                         <i class="bi bi-receipt"></i>
                         Ver meu pedido
                     </a>

                     <a th:href="@{/store/homepage}" class="btn-continue-shopping">
                         <i class="bi bi-arrow-left"></i>
                         Continuar comprando
                     </a>
                 </div>
         </section>
     </div>
 </main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
