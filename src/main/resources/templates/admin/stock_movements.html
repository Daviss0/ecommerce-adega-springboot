<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Histórico de Estoque - Adega do Campinho</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: #eef6fa;
            font-family: Arial, sans-serif;
        }

        .sidebar {
            width: 230px;
            min-height: 100vh;
            background: #1e6fa8;
            color: #fff;
            position: fixed;
            left: 0;
            top: 0;
            padding: 25px 18px;
        }

        .sidebar h4 {
            font-weight: bold;
            margin-bottom: 40px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #eaf6ff;
            text-decoration: none;
            padding: 12px 10px;
            border-radius: 10px;
            margin-bottom: 8px;
            transition: 0.2s;
        }

        .menu-item:hover,
        .menu-item.active {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        .logout-btn {
            background: none;
            border: none;
            color: #eaf6ff;
            width: 100%;
            text-align: left;
            padding: 12px 10px;
            border-radius: 10px;
        }

        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        .main-content {
            margin-left: 230px;
            padding: 30px;
        }

        .topbar {
            background: #fff;
            border-radius: 18px;
            padding: 18px 25px;
            box-shadow: 0px 8px 25px rgba(0, 0, 0, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .movement-card {
            background: #fff;
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .movement-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .table {
            margin-bottom: 0;
        }

        .table thead th {
            background: #f5fbff;
            color: #1e6fa8;
            font-size: 14px;
            border-bottom: 1px solid #e3edf5;
            padding: 14px;
        }

        .table tbody td {
            vertical-align: middle;
            padding: 14px;
            color: #333;
            font-size: 14px;
        }

        .badge-entry {
            background: #d1f7e0;
            color: #168a45;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .badge-exit {
            background: #ffd6d6;
            color: #b42323;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .badge-adjust {
            background: #fff3cd;
            color: #9a6a00;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .btn-back {
            border: none;
            border-radius: 12px;
            padding: 10px 18px;
            background: linear-gradient(90deg, #35c4d9, #5a83e6);
            color: #fff;
            font-weight: 600;
            text-decoration: none;
        }

        .btn-back:hover {
            opacity: 0.9;
            color: #fff;
        }
    </style>
</head>
<body>

<aside class="sidebar">
    <h4>Adega Admin</h4>

    <a th:href="@{/admin/home}" class="menu-item">
        <i class="bi bi-grid-fill"></i>
        Dashboard
    </a>

    <a th:href="@{/admin/products}" class="menu-item">
        <i class="bi bi-box-seam"></i>
        Produtos
    </a>

    <a th:href="@{/admin/clients}" class="menu-item">
        <i class="bi bi-people-fill"></i>
        Clientes
    </a>

    <a th:href="@{/admin/orders}" class="menu-item">
        <i class="bi bi-cart-check-fill"></i>
        Pedidos
    </a>

    <a th:href="@{/admin/stock}" class="menu-item active">
        <i class="bi bi-clipboard-data-fill"></i>
        Estoque
    </a>

    <a th:href="@{/admin/users}" class="menu-item">
        <i class="bi bi-person-gear"></i>
        Usuários
    </a>

    <form th:action="@{/admin/logout}" method="post" class="mt-5">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button type="submit" class="logout-btn">
            <i class="bi bi-box-arrow-right"></i>
            Sair
        </button>
    </form>
</aside>

<main class="main-content">
    <div class="topbar">
        <div>
        <h3 class="mb-0">Histórico de Estoque</h3>
        <small class="text-muted">Acompanhe todas as entradas e saídas de produtos</small>
    </div>

    <a th:href="@{/admin/stock}" class="btn-back">
        <i class="bi bi-arrow-left-circle"></i>
        Voltar
    </a>
    </div>

    <div class="movement-card">

        <div class="movement-header">
            <h5 class="mb-0">Movimentações Realizadas</h5>
        </div>

        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                <tr>
                    <th>Data</th>
                    <th>Produto</th>
                    <th>Tipo</th>
                    <th>Quantidade</th>
                    <th>Motivo</th>
                    <th>Usuário</th>
                </tr>
                </thead>

                <tbody>

                <tr th:if="${#lists.isEmpty(movements)}">
                    <td colspan="6" class="text-center text-muted py-4">
                        Nenhuma movimentação de estoque registrada.
                    </td>
                </tr>

                <tr th:each="movement : ${movements}">
                    <td th:text="${#temporals.format(movement.createdAt, 'dd/MM/yyyy HH:mm')}"></td>

                    <td th:text="${movement.product.name}"></td>

                    <td>
                        <span th:if="${movement.type.name() == 'ENTRADA'}" class="badge-entry">
                            Entrada
                        </span>

                        <span th:if="${movement.type.name() == 'SAIDA'}" class="badge-exit">
                            Saída
                        </span>

                        <span th:if="${movement.type.name() == 'AJUSTE'}" class="badge-adjust">
                            Ajuste
                        </span>
                    </td>

                    <td th:text="${movement.quantity}"></td>

                    <td th:text="${movement.reason != null && !movement.reason.isEmpty() ? movement.reason : 'Sem motivo informado'}"></td>

                    <td th:text="${movement.userName != null ? movement.userName : 'Sistema'}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

</body>
</html>
