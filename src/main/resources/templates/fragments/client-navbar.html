<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

<div th:fragment="navbar(showStoreControls)" class="client-navbar-wrapper">

    <div class="top-info">
        <div class="container d-flex justify-content-between align-items-center">

            <span class="bi bi-whatsapp">
                (11) 98765-4321
            </span>

            <span class="bi bi-truck">
                Entrega rápida para toda região!
            </span>

            <span class="bi bi-geo-alt-fill">
                São Paulo - SP
            </span>

        </div>
    </div>


    <nav class="main-navbar">

        <div class="container">

            <div th:if="${showStoreControls}"
                 class="row align-items-center g-3">

                <div class="col-4 col-lg-2 navbar-logo-column order-1">

                    <a th:href="@{/store/homepage}">
                        <img th:src="@{/images/logo-adega.png}"
                             class="logo-img"
                             alt="Adega do Campinho">
                    </a>

                </div>


                <div class="col-5 col-lg-2 order-3 order-lg-2 navbar-store-controls">

                    <button class="category-btn w-100">
                        <i class="bi bi-list me-1"></i>
                        Categorias
                    </button>

                </div>


                <div class="col-7 col-lg-4 order-4 order-lg-3 navbar-store-controls">

                    <form th:action="@{/store/search}"
                          method="get"
                          class="d-flex">

                        <input type="text"
                               name="keyword"
                               class="form-control search-box"
                               placeholder="O que você procura?"
                               th:value="${keyword}">

                        <button class="btn search-btn"
                                type="submit"
                                aria-label="Pesquisar">

                            <i class="bi bi-search"></i>

                        </button>

                    </form>

                </div>


                <div class="col-8 col-lg-4 order-2 order-lg-4 ms-lg-auto
                            d-flex justify-content-end align-items-center">

                    <div th:replace="~{fragments/client-navbar :: navbarActions}">
                    </div>

                </div>

            </div>


            <div th:unless="${showStoreControls}"
                 class="row align-items-center">

                <div class="col-4">

                    <a th:href="@{/store/homepage}">
                        <img th:src="@{/images/logo-adega.png}"
                             class="logo-img"
                             alt="Adega do Campinho">
                    </a>

                </div>


                <div class="col-8 d-flex justify-content-end align-items-center">

                    <div th:replace="~{fragments/client-navbar :: navbarActions}">
                    </div>

                </div>

            </div>

        </div>

    </nav>

</div>


<div th:fragment="navbarActions">

    <div sec:authorize="isAnonymous()"
         class="navbar-actions">

        <a th:href="@{/client/login}"
           class="nav-action">

            <i class="bi bi-person"></i>

            <span class="nav-action-text">

                Minha Conta

                <small>
                    Entrar / Cadastrar
                </small>

            </span>

        </a>


        <a th:href="@{/client/cart}"
           class="nav-action">

            <i class="bi bi-cart3"></i>

            <span class="nav-action-text">

                Carrinho

                <small>
                   Ver carrinho
                </small>

            </span>

        </a>

    </div>


    <div sec:authorize="hasRole('CLIENT')"
         class="navbar-actions">

        <div class="dropdown">

            <button class="account-dropdown"
                    type="button"
                    data-bs-toggle="dropdown"
                    aria-expanded="false">

                <i class="bi bi-person-circle"></i>

                <span class="account-text">

                    Minha Conta

                    <small sec:authentication="name"
                           class="account-email">
                        cliente@email.com
                    </small>

                </span>

                <i class="bi bi-chevron-down dropdown-arrow"></i>

            </button>


            <ul class="dropdown-menu dropdown-menu-end account-menu">

                <li>
                    <a th:href="@{/client/account}"
                       class="dropdown-item">

                        <i class="bi bi-person me-2"></i>
                        Minha conta

                    </a>
                </li>

                <li>
                    <a th:href="@{/client/orders}"
                       class="dropdown-item">

                        <i class="bi bi-bag me-2"></i>
                        Meus pedidos

                    </a>
                </li>

                <li>
                    <hr class="dropdown-divider">
                </li>

                <li>

                    <form th:action="@{/client/logout}"
                          method="post">

                        <button type="submit"
                                class="dropdown-item logout-menu-item">

                            <i class="bi bi-box-arrow-right me-2"></i>
                            Sair

                        </button>

                    </form>

                </li>

            </ul>

        </div>


        <a th:href="@{/client/cart}"
           class="nav-action">

            <i class="bi bi-cart3"></i>

            <span class="nav-action-text">

                Carrinho


<small>
    <span id="navbar-cart-count"
          th:text="${cartItemCount}">0</span>

    <span id="navbar-cart-count-label"
          th:text="${cartItemCount == 1 ? ' item · ' : ' itens · '}">
        itens ·
    </span>

    <span id="navbar-cart-total"
          th:text="${'R$ ' + #numbers.formatDecimal(cartTotal, 1, 'POINT', 2, 'COMMA')}">
        R$ 0,00
    </span>
</small>


            </span>

        </a>

    </div>

</div>

</body>
</html>
