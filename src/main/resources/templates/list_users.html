<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Usuários - Adega do Campinho</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: #eef6fa;
            font-family: Arial, sans-serif;
        }

        .sidebar {
            width: 230px;
            min-height: 100vh;
            background: #1e6fa8;
            color: #fff;
            position: fixed;
            left: 0;
            top: 0;
            padding: 25px 18px;
        }

        .sidebar h4 {
            font-weight: bold;
            margin-bottom: 40px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #eaf6ff;
            text-decoration: none;
            padding: 12px 10px;
            border-radius: 10px;
            margin-bottom: 8px;
            transition: 0.2s;
        }

        .menu-item:hover,
        .menu-item.active {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        .logout-btn {
            background: none;
            border: none;
            color: #eaf6ff;
            width: 100%;
            text-align: left;
            padding: 12px 10px;
        }

        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        .main-content {
            margin-left: 230px;
            padding: 30px;
        }

        .topbar {
            background: #fff;
            border-radius: 18px;
            padding: 18px 25px;
            box-shadow: 0px 8px 25px rgba(0, 0, 0, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .search-box {
            width: 280px;
            background: #dff7ff;
            border-radius: 12px;
            border: none;
            padding: 10px 15px;
            outline: none;
        }

        .user-card {
            background: #fff;
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .user-header {
            display: flex;
            justify-content: space-between;



            
        }

    </style>

</head>
<body>

</body>
</html>
